[package]
name = "iso-user-lumen"
version = "0.1.0"
edition = "2024"
publish = false

# Q. T. Felix NOTE: lumen 프로젝트의 elib-k0-nt 와이어 호환성을 Ring 3 사용자
#                   공간에서 검증하는 전용 사용자 프로그램입니다. lumen 자체에는
#                   의존하지 않으며, lumen 의 lumen-channel / lumen-core /
#                   lumen-capability 가 사용하는 것과 *동일한* elib-k0-nt 모듈
#                   을 직접 호출하여 동일 입력 → 동일 비트 출력을 실증합니다.
#                   (lumen 의 KERNEL-COMPAT.md §3 와이어 호환 표 참고.)

[[bin]]
name = "iso-user-lumen"
path = "src/main.rs"
test = false
bench = false
doctest = false

[dependencies]
zeroize       = { path = "../../../elib-k0-nt/zeroize", version = "1.0.0" }
constant-time = { path = "../../../elib-k0-nt/constant-time", version = "1.0.0" }
blake         = { path = "../../../elib-k0-nt/blake", version = "1.0.0" }
ed25519       = { path = "../../../elib-k0-nt/ed25519", version = "1.0.0" }
x25519        = { path = "../../../elib-k0-nt/x25519", version = "1.0.0" }
aes           = { path = "../../../elib-k0-nt/aes", version = "1.0.0" }
sha2          = { path = "../../../elib-k0-nt/sha2", version = "1.0.0" }
sha3          = { path = "../../../elib-k0-nt/sha3", version = "1.0.0" }
# Phase 4 Plan 01 postcard 와이어 프레임 alloc-free 의존성 (D-15)
postcard      = { version = "1", default-features = false }
serde         = { version = "1", default-features = false, features = ["derive"] }

# Phase 7 Plan 04 SC #5 cargo-machete dead-dep 게이트 deferred 처리
#
# 본 entries 는 cargo-machete v0.9.2 가 본 crate 최상위 [dependencies] 에서
# `use` 직접 호출 부재로 신호한 dead deps 정본 정책 (.machete.toml proc-macro
# 위양성만 허용) 위배 회피를 위해 본 per-crate metadata 로 격리 처리
# Phase 7 Plan 04 의 정본 audit scope 가 커널 Cargo.toml 만 다루기에 본 sibling
# user-space crate 의 dead-dep cleanup 은 별도 cleanup plan 으로 deferred
# 처리 (.planning/phases/07-integration-gap-audit/deferred-items.md 참고)
# 본 ignore 는 임시 정본 cleanup 시 본 metadata block 전체 삭제 필요
[package.metadata.cargo-machete]
ignored = [
    "zeroize",        # Phase 7 Plan 04 deferred dedicated cleanup plan 에서 처리
    "constant-time",  # Phase 7 Plan 04 deferred dedicated cleanup plan 에서 처리
    "sha2",           # Phase 7 Plan 04 deferred dedicated cleanup plan 에서 처리
    "sha3",           # Phase 7 Plan 04 deferred dedicated cleanup plan 에서 처리
    "postcard",       # Phase 7 Plan 04 deferred dedicated cleanup plan 에서 처리
    "serde",          # Phase 7 Plan 04 deferred dedicated cleanup plan 에서 처리
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
